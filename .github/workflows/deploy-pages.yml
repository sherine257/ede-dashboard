name: Deploy dashboard to GitHub Pages

# Enable GitHub Pages in repo Settings first, then run this workflow manually.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp DT_Projects_Dashboard_SharePoint.html _site/DT_Projects_Dashboard_SharePoint.html
          cp download.html _site/download.html
          cp DT_Projects_Dashboard_SharePoint.zip _site/DT_Projects_Dashboard_SharePoint.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
